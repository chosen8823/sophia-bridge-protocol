name: Sophia Branch Transform Atom

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  branch-engine:
    name: Branch engine membrane
    runs-on: ubuntu-latest
    env:
      SOPHIA_REF_NAME: ${{ github.head_ref || github.ref_name }}
      SOPHIA_ATOM_OUT: sophia-unified/state/github-transform/branch-transform-atom.json
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run Sophia semantic slice
        id: sophia_tests
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            sophia-unified/tests/test_morphogenic_transducer.py \
            sophia-unified/tests/test_field_thermometer.py \
            sophia-unified/tests/test_branch_transform_atom.py \
            sophia-unified/tests/test_filesystem_ingestor.py \
            sophia-unified/tests/test_regulatory_organs.py \
            sophia-unified/tests/test_webhook_transformer.py \
            sophia-unified/tests/test_file_hydrator.py \
            sophia-unified/tests/test_filesystem_field.py \
            sophia-unified/tests/test_ai_ecology.py \
            sophia-unified/tests/test_projection_field.py \
            -q

      - name: Emit branch transform atom
        if: always()
        run: |
          python sophia-unified/scripts/emit_branch_transform_atom.py \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --ref-name "$SOPHIA_REF_NAME" \
            --sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --workflow "${{ github.workflow }}" \
            --runner-os "${{ runner.os }}" \
            --test-conclusion "${{ steps.sophia_tests.outcome }}" \
            --out "$SOPHIA_ATOM_OUT"

      - name: Upload branch transform atom
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sophia-branch-transform-atom-${{ github.run_id }}
          path: ${{ env.SOPHIA_ATOM_OUT }}
          if-no-files-found: error

      - name: Enforce Sophia slice result
        if: always() && steps.sophia_tests.outcome != 'success'
        run: exit 1
